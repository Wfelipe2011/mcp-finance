services:
  auth:
    build: ./auth/app
    environment:
      PORT: "3000"
      PLUGGY_EMAIL: ${PLUGGY_EMAIL}
      PLUGGY_PASSWORD: ${PLUGGY_PASSWORD}
      PLUGGY_URL: https://meu.pluggy.ai/
      PLUGGY_SELECTOR_LOGIN_LINK: "a[href*='/login']"
      PLUGGY_SELECTOR_EMAIL: "input[type='email']"
      PLUGGY_SELECTOR_SUBMIT_EMAIL: "button[type='submit']"
      PLUGGY_SUCCESS_URL_PATTERN: meu.pluggy.ai
      GMAIL_LINK_SENDER: no-reply@pluggy.ai
      GMAIL_MAGIC_LINK_URL_PATTERN: auth0.com
    volumes:
      - ./auth/data:/app/data
      - ./auth/screenshots:/app/screenshots
    restart: unless-stopped

  api-server:
    build: .
    ports:
      - "4001:3001"
    environment:
      DATABASE_URL: postgres://finance:finance@postgres:5432/finance
      TOKEN_URL: http://auth:3000/token
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      APP_SECRET: ${APP_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    restart: unless-stopped

  supervisor:
    build: .
    command: bun run supervisor
    environment:
      DATABASE_URL: postgres://finance:finance@postgres:5432/finance
      APP_SECRET: ${APP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/infrastructure/db/silver-dimensions.sql:/docker-entrypoint-initdb.d/02-silver-dimensions.sql:ro
      - ./src/infrastructure/db/gold-ai.sql:/docker-entrypoint-initdb.d/03-gold-ai.sql:ro
      - ./src/infrastructure/db/silver-facts.sql:/docker-entrypoint-initdb.d/04-silver-facts.sql:ro
      - ./src/infrastructure/db/gold-cubes.sql:/docker-entrypoint-initdb.d/05-gold-cubes.sql:ro
      - ./src/infrastructure/db/grants.sql:/docker-entrypoint-initdb.d/06-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
